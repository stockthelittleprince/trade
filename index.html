<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>交易筆記與點位追蹤系統</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dark: {
                            bg: '#0A0E17',
                            card: '#141C2B',
                            border: '#212D42',
                            hover: '#1B263B',
                            input: '#0E1420'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #0A0E17; }
        ::-webkit-scrollbar-thumb { background: #212D42; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #324361; }
    </style>
</head>
<body class="bg-dark-bg text-slate-100 font-sans min-h-screen flex flex-col antialiased selection:bg-blue-600 selection:text-white pb-12">

    <!-- Top Navigation Header -->
    <header class="border-b border-dark-border bg-dark-card/90 backdrop-blur sticky top-0 z-30">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="p-2 bg-blue-500/10 text-blue-400 rounded-xl border border-blue-500/20">
                    <i class="fa-solid fa-chart-line text-xl"></i>
                </div>
                <div>
                    <h1 class="font-extrabold text-lg tracking-wide text-white flex items-center gap-2">
                        TRADING JOURNAL
                        <span class="text-xs font-normal text-blue-400 bg-blue-500/10 px-2 py-0.5 rounded-full border border-blue-500/20">點位 & 策略追蹤</span>
                    </h1>
                </div>
            </div>

            <!-- Backup and Restore Actions -->
            <div class="flex items-center space-x-2">
                <button onclick="exportData()" title="下載 JSON 備份檔" class="px-3 py-1.5 rounded-lg bg-dark-card hover:bg-dark-hover text-slate-300 border border-dark-border transition text-xs flex items-center space-x-1.5">
                    <i class="fa-solid fa-download text-blue-400"></i>
                    <span>匯出備份</span>
                </button>
                <button onclick="openImportModal()" title="匯入 JSON 備份檔" class="px-3 py-1.5 rounded-lg bg-dark-card hover:bg-dark-hover text-slate-300 border border-dark-border transition text-xs flex items-center space-x-1.5">
                    <i class="fa-solid fa-upload text-emerald-400"></i>
                    <span>匯入資料</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-8 flex-grow w-full">

        <!-- Forms Grid Section -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">

            <!-- 1. Position Entry Form -->
            <section class="bg-dark-card border border-dark-border rounded-xl p-5 space-y-4 shadow-lg">
                <div class="flex items-center space-x-2 border-b border-dark-border pb-3">
                    <i class="fa-solid fa-crosshairs text-blue-400"></i>
                    <h2 class="font-bold text-slate-100 text-sm">新增進場部位點位</h2>
                </div>

                <form onsubmit="handleAddPosition(event)" class="space-y-3 text-xs">
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-slate-400 mb-1">商品名稱</label>
                            <input type="text" id="posSymbol" required placeholder="例如：台指期、小台" class="w-full bg-dark-input border border-dark-border rounded-lg p-2.5 text-slate-100 focus:outline-none focus:border-blue-500">
                        </div>
                        <div>
                            <label class="block text-slate-400 mb-1">方向</label>
                            <select id="posSide" class="w-full bg-dark-input border border-dark-border rounded-lg p-2.5 text-slate-100 focus:outline-none focus:border-blue-500">
                                <option value="做多">做多 (Long)</option>
                                <option value="做空">做空 (Short)</option>
                            </select>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-slate-400 mb-1">進場點位 / 價格</label>
                            <input type="number" step="any" id="posPrice" required placeholder="例如：40000" class="w-full bg-dark-input border border-dark-border rounded-lg p-2.5 font-mono text-slate-100 focus:outline-none focus:border-blue-500">
                        </div>
                        <div>
                            <label class="block text-slate-400 mb-1">數量 (口/股)</label>
                            <input type="number" id="posQty" min="1" value="1" required class="w-full bg-dark-input border border-dark-border rounded-lg p-2.5 font-mono text-slate-100 focus:outline-none focus:border-blue-500">
                        </div>
                    </div>

                    <div>
                        <label class="block text-slate-400 mb-1">進場原因與備註 (選填)</label>
                        <input type="text" id="posNote" placeholder="例如：黑後紅策略進場第1口" class="w-full bg-dark-input border border-dark-border rounded-lg p-2.5 text-slate-100 focus:outline-none focus:border-blue-500">
                    </div>

                    <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-medium py-2.5 rounded-lg transition shadow-md shadow-blue-600/20 text-xs flex items-center justify-center space-x-1">
                        <i class="fa-solid fa-plus"></i>
                        <span>新增部位紀錄</span>
                    </button>
                </form>
            </section>

            <!-- 2. Create Strategy Form -->
            <section class="bg-dark-card border border-dark-border rounded-xl p-5 space-y-4 shadow-lg flex flex-col justify-between">
                <div>
                    <div class="flex items-center space-x-2 border-b border-dark-border pb-3 mb-3
