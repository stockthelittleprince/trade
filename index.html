<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>交易筆記與點位追蹤器</title>
  <style>
    :root {
      --bg-color: #0b0e14;
      --card-bg: #151922;
      --card-border: #232936;
      --text-main: #f0f4f8;
      --text-muted: #8b96a5;
      --accent-blue: #3b82f6;
      --accent-green: #10b981;
      --accent-red: #ef4444;
      --hover-bg: #1c2230;
      --input-bg: #0f1218;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 24px;
      line-height: 1.5;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--card-border);
    }

    h1 {
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .header-actions {
      display: flex;
      gap: 10px;
    }

    button {
      background: var(--card-bg);
      color: var(--text-main);
      border: 1px solid var(--card-border);
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 500;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    button:hover {
      background: var(--hover-bg);
      border-color: #3b82f688;
    }

    button.primary {
      background: var(--accent-blue);
      border-color: var(--accent-blue);
      color: #fff;
    }

    button.primary:hover {
      background: #2563eb;
    }

    button.danger {
      background: #321920;
      color: #f87171;
      border-color: #5c222c;
    }

    button.danger:hover {
      background: var(--accent-red);
      color: #fff;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 24px;
    }

    @media (max-width: 868px) {
      .grid-2 {
        grid-template-columns: 1fr;
      }
    }

    .section-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 18px;
    }

    .section-title {
      font-size: 1.05rem;
      font-weight: 600;
      margin-bottom: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .form-group {
      margin-bottom: 12px;
    }

    label {
      display: block;
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 5px;
    }

    input, select {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 9px 12px;
      border-radius: 6px;
      font-size: 0.88rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus, select:focus {
      border-color: var(--accent-blue);
    }

    .form-row {
      display: flex;
      gap: 12px;
    }

    .form-row .form-group {
      flex: 1;
    }

    /* 折疊控制與策略網格 */
    .collapsible-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      user-select: none;
    }

    .strategy-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 16px;
      margin-top: 16px;
    }

    .strategy-grid.collapsed {
      display: none;
    }

    .strat-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .strat-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .strat-name {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .btn-icon {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 4px 6px;
      font-size: 0.95rem;
      border-radius: 4px;
      cursor: pointer;
    }

    .btn-icon:hover {
      color: var(--accent-red);
      background: #2a1b20;
    }

    .strat-stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      background: var(--input-bg);
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 12px;
      border: 1px solid #1a202c;
    }

    .stat-box {
      text-align: center;
    }

    .stat-label {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .stat-val {
      font-size: 1.1rem;
      font-weight: 700;
      margin-top: 2px;
    }

    .val-profit { color: var(--accent-green); }
    .val-loss { color: var(--accent-red); }

    .strat-inputs {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .strat-input-row {
      display: flex;
      gap: 8px;
    }

    .strat-input-row input {
      font-size: 0.85rem;
      padding: 6px 10px;
    }

    /* 部位列表表格 */
    .table-container {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.88rem;
    }

    th, td {
      padding: 10px 12px;
      border-bottom: 1px solid var(--card-border);
    }

    th {
      color: var(--text-muted);
      font-weight: 600;
      font-size: 0.78rem;
      background: #11151c;
    }

    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 600;
    }

    .badge-long { background: #064e3b; color: #34d399; }
    .badge-short { background: #7f1d1d; color: #fca5a5; }

    .empty-tip {
      text-align: center;
      padding: 24px;
      color: var(--text-muted);
      font-size: 0.88rem;
    }

    .toggle-all-btn {
      display: block;
      width: 100%;
      text-align: center;
      margin-top: 12px;
      background: var(--input-bg);
      color: var(--text-muted);
      border: 1px dashed var(--card-border);
      padding: 8px;
      font-size: 0.8rem;
      border-radius: 6px;
      cursor: pointer;
    }

    .toggle-all-btn:hover {
      color: var(--text-main);
      border-color: var(--accent-blue);
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>📈 交易點位與策略筆記</h1>
      <div class="header-actions">
        <button onclick="exportData()">📥 備份資料 (JSON)</button>
        <button onclick="importData()">📤 匯入備份</button>
      </div>
    </header>

    <div class="grid-2">
      <!-- 新增進場部位點位 -->
      <div class="section-card">
        <div class="section-title">📌 新增進場部位點位</div>
        <form id="positionForm" onsubmit="addPosition(event)">
          <div class="form-row">
            <div class="form-group">
              <label>商品名稱</label>
              <input type="text" id="symbol" placeholder="例如：小台 / 台指期" required>
            </div>
            <div class="form-group">
              <label>方向</label>
              <select id="side">
                <option value="做多">做多 (Long)</option>
                <option value="做空">做空 (Short)</option>
              </select>
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>進場點位 / 價格</label>
              <input type="number" step="any" id="entryPrice" placeholder="例如：40000" required>
            </div>
            <div class="form-group">
              <label>數量 (口/股)</label>
              <input type="number" id="qty" value="1" min="1" required>
            </div>
          </div>
          <div class="form-group">
            <label>進場原因與備註</label>
            <input type="text" id="posNote" placeholder="例如：黑後紅策略進場第1口">
          </div>
          <button type="submit" class="primary" style="width: 100%;">新增部位記錄</button>
        </form>
      </div>

      <!-- 新增特殊策略卡片 -->
      <div class="section-card">
        <div class="section-title">⚡ 新增特殊策略卡片</div>
        <form id="strategyForm" onsubmit="addStrategy(event)">
          <div class="form-group">
            <label>策略名稱</label>
            <input type="text" id="stratName" placeholder="例如：特殊策略 黑後紅" required>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>初始累計損益</label>
              <input type="number" id="stratInitPnl" value="0" placeholder="0">
            </div>
            <div class="form-group">
              <label>初始累計次數</label>
              <input type="number" id="stratInitCount" value="0" placeholder="0">
            </div>
          </div>
          <button type="submit" class="primary" style="width: 100%; margin-top: 10px;">建立策略卡片</button>
        </form>
      </div>
    </div>

    <!-- 特殊策略卡片列表（可展開/關閉） -->
    <div style="margin-bottom: 24px;">
      <div class="collapsible-header" onclick="toggleStrategySection()">
        <h2 style="font-size: 1.15rem; color: var(--text-main); display: flex; align-items: center; gap: 8px;">
          🎯 特殊策略卡片區塊
        </h2>
        <button type="button" id="stratToggleBtn" style="padding: 4px 10px; font-size: 0.8rem;">▼ 展開 / 收合</button>
      </div>
      
      <div class="strategy-grid" id="strategyGrid"></div>
    </div>

    <!-- 進場部位記錄表格（預設僅顯示前 3 筆） -->
    <div class="section-card">
      <div class="section-title">
        <span>📋 進場部位記錄 (預設顯示最新 3 筆)</span>
        <button onclick="clearPositions()" class="danger" style="padding: 4px 10px; font-size: 0.75rem;">清空所有部位</button>
      </div>
      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>日期時間</th>
              <th>商品名稱</th>
              <th>方向</th>
              <th>進場點位</th>
              <th>數量</th>
              <th>進場備註</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="positionTableBody"></tbody>
        </table>
      </div>
      <button class="toggle-all-btn" id="togglePosBtn" onclick="toggleShowAllPositions()" style="display: none;"></button>
    </div>
  </div>

  <script>
    let positions = JSON.parse(localStorage.getItem('trade_positions')) || [
      { id: 1, date: '2026-10-22 09:15', symbol: '小台', side: '做多', price: 40000, qty: 1, note: '進場第1口' },
      { id: 2, date: '2026-10-22 10:30', symbol: '小台', side: '做多', price: 42000, qty: 1, note: '加碼第2口' }
    ];

    let strategies = JSON.parse(localStorage.getItem('trade_strategies')) || [
      { id: 1, name: '特殊策略 黑後紅', pnl: -3000, count: 1 }
    ];

    let showAllPositions = false;
    let isStrategyCollapsed = false;

    function saveData() {
      localStorage.setItem('trade_positions', JSON.stringify(positions));
      localStorage.setItem('trade_strategies', JSON.stringify(strategies));
      render();
    }

    function toggleStrategySection() {
      isStrategyCollapsed = !isStrategyCollapsed;
      const grid = document.getElementById('strategyGrid');
      const btn = document.getElementById('stratToggleBtn');
      if (isStrategyCollapsed) {
        grid.classList.add('collapsed');
        btn.textContent = '▶ 展開區塊';
      } else {
        grid.classList.remove('collapsed');
        btn.textContent = '▼ 收合區塊';
      }
    }

    function toggleShowAllPositions() {
      showAllPositions = !showAllPositions;
      render();
    }

    function addPosition(e) {
      e.preventDefault();
      const symbol = document.getElementById('symbol').value;
      const side = document.getElementById('side').value;
      const price = parseFloat(document.getElementById('entryPrice').value);
      const qty = parseInt(document.getElementById('qty').value);
      const note = document.getElementById('posNote').value;

      const now = new Date();
      const dateStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;

      positions.unshift({ id: Date.now(), date: dateStr, symbol, side, price, qty, note });
      document.getElementById('positionForm').reset();
      saveData();
    }

    function deletePosition(id) {
      if (confirm('確定要刪除這筆部位記錄嗎？')) {
        positions = positions.filter(p => p.id !== id);
        saveData();
      }
    }

    function clearPositions() {
      if (confirm('確定要刪除「所有」部位記錄嗎？')) {
        positions = [];
        saveData();
      }
    }

    function addStrategy(e) {
      e.preventDefault();
      const name = document.getElementById('stratName').value;
      const pnl = parseFloat(document.getElementById('stratInitPnl').value) || 0;
      const count = parseInt(document.getElementById('stratInitCount').value) || 0;

      strategies.push({ id: Date.now(), name, pnl, count });
      document.getElementById('strategyForm').reset();
      saveData();
    }

    function updateStrategyData(id) {
      const pnlInput = document.getElementById(`pnl-inp-${id}`);
      const cntInput = document.getElementById(`cnt-inp-${id}`);
      
      const pnlVal = pnlInput.value.trim();
      const cntVal = cntInput.value.trim();

      const strat = strategies.find(s => s.id === id);
      if (!strat) return;

      if (pnlVal !== '') {
        const addedPnl = parseFloat(pnlVal);
        if (!isNaN(addedPnl)) {
          strat.pnl += addedPnl;
          if (cntVal === '') {
            strat.count += 1;
          }
        }
      }

      if (cntVal !== '') {
        const newCount = parseInt(cntVal);
        if (!isNaN(newCount)) {
          strat.count = newCount;
        }
      }

      pnlInput.value = '';
      cntInput.value = '';
      saveData();
    }

    function editStrategyDirect(id) {
      const strat = strategies.find(s => s.id === id);
      if (!strat) return;

      const newPnl = prompt(`請輸入 ${strat.name} 的「最新總累計損益」：`, strat.pnl);
      if (newPnl === null) return;

      const newCount = prompt(`請輸入 ${strat.name} 的「最新總累計次數」：`, strat.count);
      if (newCount === null) return;

      const p = parseFloat(newPnl);
      const c = parseInt(newCount);

      if (!isNaN(p)) strat.pnl = p;
      if (!isNaN(c)) strat.count = c;

      saveData();
    }

    function deleteStrategy(id) {
      if (confirm('確定要刪除這張策略卡片嗎？')) {
        strategies = strategies.filter(s => s.id !== id);
        saveData();
      }
    }

    function exportData() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify({ positions, strategies }, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `trade_backup_${new Date().toISOString().slice(0,10)}.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }

    function importData() {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = '.json';
      input.onchange = e => {
        const file = e.target.files[0];
        const reader = new FileReader();
        reader.onload = event => {
          try {
            const data = JSON.parse(event.target.result);
            if (data.positions && data.strategies) {
              positions = data.positions;
              strategies = data.strategies;
              saveData();
              alert('匯入成功！');
            }
          } catch (err) {
            alert('JSON 檔案格式不符');
          }
        };
        reader.readAsText(file);
      };
      input.click();
    }

    function render() {
      // 1. 渲染策略卡片
      const grid = document.getElementById('strategyGrid');
      grid.innerHTML = '';

      if (strategies.length === 0) {
        grid.innerHTML = `<div class="empty-tip" style="grid-column: 1/-1;">尚無策略卡片</div>`;
      } else {
        strategies.forEach(s => {
          const card = document.createElement('div');
          card.className = 'strat-card';
          
          const pnlClass = s.pnl > 0 ? 'val-profit' : (s.pnl < 0 ? 'val-loss' : '');
          const pnlSign = s.pnl > 0 ? '+' : '';

          card.innerHTML = `
            <div>
              <div class="strat-header">
                <span class="strat-name">${s.name}</span>
                <div>
                  <button class="btn-icon" onclick="editStrategyDirect(${s.id})" title="直接編輯數值">✏️</button>
                  <button class="btn-icon" onclick="deleteStrategy(${s.id})" title="刪除策略">🗑️</button>
                </div>
              </div>
              <div class="strat-stats">
                <div class="stat-box">
                  <div class="stat-label">累計損益</div>
                  <div class="stat-val ${pnlClass}">${pnlSign}${s.pnl.toLocaleString()}</div>
                </div>
                <div class="stat-box">
                  <div class="stat-label">累計次數</div>
                  <div class="stat-val">${s.count} 次</div>
                </div>
              </div>
            </div>
            <div class="strat-inputs">
              <div class="strat-input-row">
                <input type="text" id="pnl-inp-${s.id}" placeholder="損益 (+3000 / -2000)" onkeydown="if(event.key==='Enter') updateStrategyData(${s.id})">
                <input type="number" id="cnt-inp-${s.id}" placeholder="重設次數" style="width: 85px;" onkeydown="if(event.key==='Enter') updateStrategyData(${s.id})">
              </div>
              <button class="primary" style="width: 100%; justify-content: center;" onclick="updateStrategyData(${s.id})">更新累計資料</button>
            </div>
          `;
          grid.appendChild(card);
        });
      }

      // 2. 渲染部位表格（控制顯示筆數）
      const tbody = document.getElementById('positionTableBody');
      const togglePosBtn = document.getElementById('togglePosBtn');
      tbody.innerHTML = '';

      if (positions.length === 0) {
        tbody.innerHTML = `<tr><td colspan="7" class="empty-tip">目前沒有任何部位點位記錄。</td></tr>`;
        togglePosBtn.style.display = 'none';
      } else {
        const displayPositions = showAllPositions ? positions : positions.slice(0, 3);

        displayPositions.forEach(p => {
          const tr = document.createElement('tr');
          const sideBadge = p.side === '做多' 
            ? `<span class="badge badge-long">做多</span>` 
            : `<span class="badge badge-short">做空</span>`;

          tr.innerHTML = `
            <td style="color: var(--text-muted); font-size: 0.8rem;">${p.date}</td>
            <td style="font-weight: 600;">${p.symbol}</td>
            <td>${sideBadge}</td>
            <td style="font-size: 0.95rem; font-weight: 700; color: var(--accent-blue);">${p.price.toLocaleString()}</td>
            <td>${p.qty}</td>
            <td style="color: var(--text-muted);">${p.note || '-'}</td>
            <td><button class="btn-icon" onclick="deletePosition(${p.id})">🗑️</button></td>
          `;
          tbody.appendChild(tr);
        });

        if (positions.length > 3) {
          togglePosBtn.style.display = 'block';
          togglePosBtn.textContent = showAllPositions 
            ? '▲ 收合僅顯示最新 3 筆記錄' 
            : `▼ 展開顯示全部部位 (共 ${positions.length} 筆)`;
        } else {
          togglePosBtn.style.display = 'none';
        }
      }
    }

    render();
  </script>
</body>
</html>
