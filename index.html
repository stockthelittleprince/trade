<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>交易筆記與點位追蹤系統</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        forest: {
                            bg: '#081216',
                            card: 'rgba(12, 26, 32, 0.75)',
                            border: 'rgba(26, 50, 59, 0.8)',
                            hover: 'rgba(20, 42, 50, 0.85)',
                            input: 'rgba(8, 18, 23, 0.85)',
                            glow: '#f59e0b',
                            cyan: '#14b8a6'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #081216; }
        ::-webkit-scrollbar-thumb { background: #1a323b; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #264754; }
        
        /* 樹屋燈籠背景圖設定 */
        .treehouse-bg {
            background-image: linear-gradient(to bottom, rgba(8, 18, 22, 0.7), rgba(8, 18, 22, 0.82)), url('https://lh3.googleusercontent.com/gg/AEmRCDF9j2Amsx0iH_iO-b_HagNlqF1zK_XQ-42U4N532I4C8t6Lp5lZIn3A8c_N79-fG0U8Y4O4=s1024');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
        }

        .lantern-glow {
            box-shadow: 0 0 15px rgba(245, 158, 11, 0.2);
        }
        .lantern-glow:hover {
            box-shadow: 0 0 25px rgba(245, 158, 11, 0.4);
        }
    </style>
</head>
<body class="treehouse-bg text-slate-100 font-sans min-h-screen flex flex-col antialiased selection:bg-amber-500 selection:text-slate-950 pb-12">

    <!-- Top Navigation Header -->
    <header class="border-b border-forest-border bg-forest-bg/80 backdrop-blur-md sticky top-0 z-30 shadow-2xl">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="p-2 bg-amber-500/20 text-amber-300 rounded-xl border border-amber-500/30 shadow-[0_0_12px_rgba(245,158,11,0.3)]">
                    <i class="fa-solid fa-tree-city text-xl"></i>
                </div>
                <div>
                    <h1 class="font-extrabold text-lg tracking-wide text-amber-100 flex items-center gap-2">
                        TRADING JOURNAL
                        <span class="text-xs font-normal text-teal-300 bg-teal-500/20 px-2.5 py-0.5 rounded-full border border-teal-500/30">奇幻樹屋風格</span>
                    </h1>
                </div>
            </div>

            <!-- Backup and Restore Actions -->
            <div class="flex items-center space-x-2">
                <button onclick="exportData()" title="下載 JSON 備份檔" class="px-3 py-1.5 rounded-lg bg-forest-card hover:bg-forest-hover text-slate-200 border border-forest-border backdrop-blur-md transition text-xs flex items-center space-x-1.5 shadow-md">
                    <i class="fa-solid fa-download text-teal-400"></i>
                    <span>匯出備份</span>
                </button>
                <button onclick="openImportModal()" title="匯入 JSON 備份檔" class="px-3 py-1.5 rounded-lg bg-forest-card hover:bg-forest-hover text-slate-200 border border-forest-border backdrop-blur-md transition text-xs flex items-center space-x-1.5 shadow-md">
                    <i class="fa-solid fa-upload text-amber-400"></i>
                    <span>匯入資料</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-8 flex-grow w-full">

        <!-- Forms Grid Section -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">

            <!-- 1. Position Entry Form -->
            <section class="bg-forest-card border border-forest-border rounded-xl p-5 space-y-4 shadow-2xl backdrop-blur-md">
                <div class="flex items-center space-x-2 border-b border-forest-border pb-3">
                    <i class="fa-solid fa-feather-pointed text-teal-400"></i>
                    <h2 class="font-bold text-amber-100 text-sm">新增進場部位點位</h2>
                </div>

                <form onsubmit="handleAddPosition(event)" class="space-y-3 text-xs">
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-teal-200/80 mb-1">商品名稱</label>
                            <input type="text" id="posSymbol" required placeholder="例如：台指期、小台" class="w-full bg-forest-input border border-forest-border rounded-lg p-2.5 text-slate-100 focus:outline-none focus:border-teal-400">
                        </div>
                        <div>
                            <label class="block text-teal-200/80 mb-1">方向</label>
                            <select id="posSide" class="w-full bg-forest-input border border-forest-border rounded-lg p-2.5 text-slate-100 focus:outline-none focus:border-teal-400">
                                <option value="做多">做多 (Long)</option>
                                <option value="做空">做空 (Short)</option>
                            </select>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-teal-200/80 mb-1">進場點位 / 價格</label>
                            <input type="number" step="any" id="posPrice" required placeholder="例如：40000" class="w-full bg-forest-input border border-forest-border rounded-lg p-2.5 font-mono text-slate-100 focus:outline-none focus:border-teal-400">
                        </div>
                        <div>
                            <label class="block text-teal-200/80 mb-1">數量 (口/股)</label>
                            <input type="number" id="posQty" min="1" value="1" required class="w-full bg-forest-input border border-forest-border rounded-lg p-2.5 font-mono text-slate-100 focus:outline-none focus:border-teal-400">
                        </div>
                    </div>

                    <div>
                        <label class="block text-teal-200/80 mb-1">進場原因與備註 (選填)</label>
                        <input type="text" id="posNote" placeholder="例如：黑後紅策略進場第1口" class="w-full bg-forest-input border border-forest-border rounded-lg p-2.5 text-slate-100 focus:outline-none focus:border-teal-400">
                    </div>

                    <button type="submit" class="w-full bg-teal-6
