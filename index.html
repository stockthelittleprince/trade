<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>交易筆記與點位追蹤系統</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        forest: {
                            bg: '#081216',
                            card: '#0e1e24',
                            border: '#1a323b',
                            hover: '#142a32',
                            input: '#0a171d',
                            glow: '#f59e0b',
                            cyan: '#14b8a6'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #081216; }
        ::-webkit-scrollbar-thumb { background: #1a323b; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #264754; }
        
        .lantern-glow {
            box-shadow: 0 0 15px rgba(245, 158, 11, 0.15);
        }
        .lantern-glow:hover {
            box-shadow: 0 0 20px rgba(245, 158, 11, 0.3);
        }
    </style>
</head>
<body class="bg-forest-bg text-slate-100 font-sans min-h-screen flex flex-col antialiased selection:bg-amber-500 selection:text-slate-950 pb-12 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-forest-hover via-forest-bg to-forest-bg">

    <!-- Top Navigation Header -->
    <header class="border-b border-forest-border bg-forest-card/80 backdrop-blur sticky top-0 z-30 shadow-lg">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="p-2 bg-amber-500/10 text-amber-400 rounded-xl border border-amber-500/20 shadow-[0_0_10px_rgba(245,158,11,0.2)]">
                    <i class="fa-solid fa-tree-city text-xl"></i>
                </div>
                <div>
                    <h1 class="font-extrabold text-lg tracking-wide text-amber-100 flex items-center gap-2">
                        TRADING JOURNAL
                        <span class="text-xs font-normal text-teal-300 bg-teal-500/10 px-2.5 py-0.5 rounded-full border border-teal-500/20">幻境樹屋風格</span>
                    </h1>
                </div>
            </div>

            <!-- Backup and Restore Actions -->
            <div class="flex items-center space-x-2">
                <button onclick="exportData()" title="下載 JSON 備份檔" class="px-3 py-1.5 rounded-lg bg-forest-card hover:bg-forest-hover text-slate-300 border border-forest-border transition text-xs flex items-center space-x-1.5 shadow-sm">
                    <i class="fa-solid fa-download text-teal-400"></i>
                    <span>匯出備份</span>
                </button>
                <button onclick="openImportModal()" title="匯入 JSON 備份檔" class="px-3 py-1.5 rounded-lg bg-forest-card hover:bg-forest-hover text-slate-300 border border-forest-border transition text-xs flex items-center space-x-1.5 shadow-sm">
                    <i class="fa-solid fa-upload text-amber-400"></i>
                    <span>匯入資料</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-8 flex-grow w-full">

        <!-- Forms Grid Section -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">

            <!-- 1. Position Entry Form -->
            <section class="bg-forest-card/90 border border-forest-border rounded-xl p-5 space-y-4 shadow-xl backdrop-blur-sm">
                <div class="flex items-center space-x-2 border-b border-forest-border pb-3">
                    <i class="fa-solid fa-feather-pointed text-teal-400"></i>
                    <h2 class="font-bold text-amber-100 text-sm">新增進場部位點位</h2>
                </div>

                <form onsubmit="handleAddPosition(event)" class="space-y-3 text-xs">
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-teal-200/70 mb-1">商品名稱</label>
                            <input type="text" id="posSymbol" required placeholder="例如：台指期、小台" class="w-full bg-forest-input border border-forest-border rounded-lg p-2.5 text-slate-100 focus:outline-none focus:border-teal-500/80">
                        </div>
                        <div>
                            <label class="block text-teal-200/70 mb-1">方向</label>
                            <select id="posSide" class="w-full bg-forest-input border border-forest-border rounded-lg p-2.5 text-slate-100 focus:outline-none focus:border-teal-500/80">
                                <option value="做多">做多 (Long)</option>
                                <option value="做空">做空 (Short)</option>
                            </select>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-teal-200/70 mb-1">進場點位 / 價格</label>
                            <input type="number" step="any" id="posPrice" required placeholder="例如：40000" class="w-full bg-forest-input border border-forest-border rounded-lg p-2.5 font-mono text-slate-100 focus:outline-none focus:border-teal-500/80">
                        </div>
                        <div>
                            <label class="block text-teal-200/70 mb-1">數量 (口/股)</label>
                            <input type="number" id="posQty" min="1" value="1" required class="w-full bg-forest-input border border-forest-border rounded-lg p-2.5 font-mono text-slate-100 focus:outline-none focus:border-teal-500/80">
                        </div>
                    </div>

                    <div>
                        <label class="block text-teal-200/70 mb-1">進場原因與備註 (選填)</label>
                        <input type="text" id="posNote" placeholder="例如：黑後紅策略進場第1口" class="w-full bg-forest-input border border-forest-border rounded-lg p-2.5 text-slate-100 focus:outline-none focus:border-teal-500/80">
                    </div>

                    <button type="submit" class="w-full bg-teal-600 hover:bg-teal-500 text-slate-950 font-bold py-2.5 rounded-lg transition shadow-md shadow-teal-600/20 text-xs flex items-center justify-center space-x-1">
                        <i class="fa-solid fa-plus"></i>
                        <span>新增部位紀錄</span>
                    </button>
                </form>
            </section>

            <!-- 2. Create Strategy Form -->
            <section class="bg-forest-card/90 border border-forest-border rounded-xl p-5 space-y-4 shadow-xl backdrop-blur-sm flex flex-col justify-between">
                <div>
                    <div class="flex items-center space-x-2 border-b border-forest-border pb-3 mb-3">
                        <i class="fa-solid fa-map-location-dot text-amber-400"></i>
                        <h2 class="font-bold text-amber-100 text-sm">新增特殊策略卡片</h2>
                    </div>

                    <form id="addStratForm" onsubmit="handleAddStrategy(event)" class="space-y-3 text-xs">
                        <div>
                            <label class="block text-amber-200/70 mb-1">策略名稱</label>
                            <input type="text" id="stratName" required placeholder="例如：特殊策略 黑後紅" class="w-full bg-forest-input border border-forest-border rounded-lg p-2.5 text-slate-100 focus:outline-none focus:border-amber-500/80">
                        </div>

                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="block text-amber-200/70 mb-1">初始累計損益 (選填)</label>
                                <input type="number" id="stratInitPnl" value="0" class="w-full bg-forest-input border border-forest-border rounded-lg p-2.5 font-mono text-slate-100 focus:outline-none focus:border-amber-500/80">
                            </div>
                            <div>
                                <label class="block text-amber-200/70 mb-1">初始累計次數 (選填)</label>
                                <input type="number" id="stratInitCount" value="0" class="w-full bg-forest-input border border-forest-border rounded-lg p-2.5 font-mono text-slate-100 focus:outline-none focus:border-amber-500/80">
                            </div>
                        </div>

                        <button type="submit" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold py-2.5 rounded-lg transition shadow-md shadow-amber-500/20 text-xs flex items-center justify-center space-x-1 mt-2 lantern-glow">
                            <i class="fa-solid fa-scroll"></i>
                            <span>建立策略卡片</span>
                        </button>
                    </form>
                </div>
            </section>

        </div>

        <!-- Strategy Cards Section -->
        <section class="space-y-4">
            <div class="flex items-center justify-between">
                <div class="flex items-center space-x-2">
                    <div class="w-2 h-5 bg-amber-400 rounded-full shadow-[0_0_8px_rgba(245,158,11,0.5)]"></div>
                    <h2 class="text-base font-bold text-amber-100">特殊策略與卡片統計</h2>
                </div>
            </div>

            <!-- Strategy Grid -->
            <div id="strategyGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                <!-- Dynamically rendered strategy cards -->
            </div>
        </section>

        <!-- Position Table Section -->
        <section class="bg-forest-card/90 border border-forest-border rounded-xl p-5 space-y-4 shadow-xl backdrop-blur-sm">
            <div class="flex justify-between items-center border-b border-forest-border pb-3">
                <div class="flex items-center space-x-2">
                    <div class="w-2 h-5 bg-teal-400 rounded-full shadow-[0_0_8px_rgba(20,184,166,0.5)]"></div>
                    <h2 class="text-base font-bold text-amber-100">已記錄之進場部位點位</h2>
                    <span id="posCountBadge" class="bg-teal-500/20 text-teal-300 text-xs px-2 py-0.5 rounded-full font-mono border border-teal-500/30">0</span>
                </div>
                <button onclick="clearAllPositions()" class="text-xs bg-rose-500/10 hover:bg-rose-500/20 text-rose-300 border border-rose-500/30 px-3 py-1.5 rounded-lg transition flex items-center space-x-1">
                    <i class="fa-solid fa-trash-can"></i>
                    <span>一鍵清空部位</span>
                </button>
            </div>

            <div class="overflow-x-auto">
                <table class="w-full text-left text-xs text-slate-300">
                    <thead class="bg-forest-input text-teal-200/70 font-medium uppercase border-b border-forest-border">
                        <tr>
                            <th class="px-4 py-3">時間</th>
                            <th class="px-4 py-3">商品名稱</th>
                            <th class="px-4 py-3">方向</th>
                            <th class="px-4 py-3">進場點位</th>
                            <th class="px-4 py-3">數量</th>
                            <th class="px-4 py-3">備註</th>
                            <th class="px-4 py-3 text-right">操作</th>
                        </tr>
                    </thead>
                    <tbody id="positionTableBody" class="divide-y divide-forest-border font-mono">
                        <!-- Dynamically rendered position rows -->
                    </tbody>
                </table>
            </div>
        </section>

    </main>

    <!-- Edit Strategy Modal -->
    <div id="editModalOverlay" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 hidden flex items-center justify-center p-4">
        <div class="bg-forest-card border border-forest-border rounded-xl max-w-sm w-full p-6 space-y-4 shadow-2xl">
            <div class="flex justify-between items-center border-b border-forest-border pb-3">
                <h3 class="font-bold text-amber-100 flex items-center space-x-2 text-sm">
                    <i class="fa-solid fa-pen-to-square text-amber-400"></i>
                    <span>直接修改策略卡片數據</span>
                </h3>
                <button onclick="closeEditModal()" class="text-slate-400 hover:text-slate-200"><i class="fa-solid fa-xmark text-base"></i></button>
            </div>

            <div class="space-y-3 text-xs">
                <input type="hidden" id="editStratId">
                <div>
                    <label class="block text-teal-200/70 mb-1">最新總累計損益</label>
                    <input type="number" id="editStratPnl" class="w-full bg-forest-input border border-forest-border rounded-lg p-2.5 font-mono text-slate-100 focus:outline-none focus:border-amber-500">
                </div>
                <div>
                    <label class="block text-teal-200/70 mb-1">最新總累計次數</label>
                    <input type="number" id="editStratCount" class="w-full bg-forest-input border border-forest-border rounded-lg p-2.5 font-mono text-slate-100 focus:outline-none focus:border-amber-500">
                </div>
            </div>

            <div class="flex justify-end space-x-2 pt-2">
                <button type="button" onclick="closeEditModal()" class="px-4 py-2 rounded-lg bg-forest-hover text-slate-300 text-xs">取消</button>
                <button type="button" onclick="saveDirectEdit()" class="px-4 py-2 rounded-lg bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold text-xs lantern-glow">儲存修改</button>
            </div>
        </div>
    </div>

    <!-- Import JSON Modal -->
    <div id="modalOverlay" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 hidden flex items-center justify-center p-4">
        <div class="bg-forest-card border border-forest-border rounded-xl max-w-md w-full p-6 space-y-4 shadow-2xl">
            <div class="flex justify-between items-center border-b border-forest-border pb-3">
                <h3 class="font-bold text-amber-100 flex items-center space-x-2 text-sm">
                    <i class="fa-solid fa-upload text-teal-400"></i>
                    <span>匯入 JSON 備份資料</span>
                </h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-slate-200"><i class="fa-solid fa-xmark text-base"></i></button>
            </div>

            <div class="space-y-3 text-xs">
                <input type="file" id="jsonFileInput" accept=".json" onchange="handleFileSelect(event)" class="block w-full text-xs text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-forest-hover file:text-slate-200 hover:file:bg-slate-700">
                <textarea id="importJsonText" rows="6" placeholder="或在此處直接貼上 JSON 備份內容..." class="w-full bg-forest-input border border-forest-border rounded-lg p-2.5 text-xs font-mono text-slate-200 focus:outline-none focus:border-teal-500"></textarea>
            </div>

            <div class="flex justify-end space-x-2 pt-2">
                <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-lg bg-forest-hover text-slate-300 text-xs">取消</button>
                <button type="button" onclick="executeImport()" class="px-4 py-2 rounded-lg bg-teal-600 hover:bg-teal-500 text-slate-950 font-bold text-xs">確認匯入</button>
            </div>
        </div>
    </div>

    <!-- JavaScript Application Logic -->
    <script>
        let appState = {
            positions: [],
            strategies: []
        };

        window.onload = function() {
            loadFromLocalStorage();
            if (appState.strategies.length === 0 && appState.positions.length === 0) {
                appState.strategies = [
                    { 
                        id: 's_1', 
                        name: '特殊策略 黑後紅', 
                        pnl: -3000, 
                        count: 1,
                        history: [
                            { date: getFormattedDate(), change: '-3,000', note: '初始建立' }
                        ]
                    }
                ];
                appState.positions = [
                    { id: 'p_1', date: getFormattedDate(), symbol: '小台', side: '做多', price: 40000, qty: 1, note: '黑後紅策略進場第1口' },
                    { id: 'p_2', date: getFormattedDate(), symbol: '小台', side: '做多', price: 42000, qty: 1, note: '加碼第2口' }
                ];
                saveToLocalStorage();
            }
            renderAll();
        };

        function loadFromLocalStorage() {
            const saved = localStorage.getItem('tj_app_data_v3');
            if (saved) {
                try {
                    appState = JSON.parse(saved);
                } catch(e) {
                    console.error('Data load error', e);
                }
            }
        }

        function saveToLocalStorage() {
            localStorage.setItem('tj_app_data_v3', JSON.stringify(appState));
        }

        function renderAll() {
            renderPositions();
            renderStrategies();
        }

        /* --- Position Handling --- */
        function handleAddPosition(e) {
            e.preventDefault();
            const symbol = document.getElementById('posSymbol').value.trim();
            const side = document.getElementById('posSide').value;
            const price = parseFloat(document.getElementById('posPrice').value);
            const qty = parseInt(document.getElementById('posQty').value);
            const note = document.getElementById('posNote').value.trim();

            appState.positions.unshift({
                id: 'p_' + Date.now(),
                date: getFormattedDate(),
                symbol,
                side,
                price,
                qty,
                note
            });

            saveToLocalStorage();
            renderPositions();

            document.getElementById('posSymbol').value = '';
            document.getElementById('posPrice').value = '';
            document.getElementById('posNote').value = '';
        }

        function deletePosition(id) {
            if (confirm('確定要刪除這筆部位記錄嗎？')) {
                appState.positions = appState.positions.filter(p => p.id !== id);
                saveToLocalStorage();
                renderPositions();
            }
        }

        function clearAllPositions() {
            if (appState.positions.length === 0) return;
            if (confirm('確定要刪除所有已記錄的部位點位嗎？此動作無法復原！')) {
                appState.positions = [];
                saveToLocalStorage();
                renderPositions();
            }
        }

        function renderPositions() {
            const tbody = document.getElementById('positionTableBody');
            document.getElementById('posCountBadge').innerText = appState.positions.length;

            if (appState.positions.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="7" class="text-center py-8 text-slate-500 font-sans">
                            <i class="fa-solid fa-box-open text-2xl mb-1 opacity-40 block"></i>
                            目前沒有任何進場部位紀錄
                        </td>
                    </tr>
                `;
                return;
            }

            tbody.innerHTML = appState.positions.map(p => {
                const isLong = p.side === '做多';
                return `
                    <tr class="hover:bg-forest-hover/60 transition">
                        <td class="px-4 py-3 text-slate-400">${p.date}</td>
                        <td class="px-4 py-3 font-bold text-slate-100 font-sans">${escapeHtml(p.symbol)}</td>
                        <td class="px-4 py-3">
                            <span class="px-2 py-0.5 rounded text-[10px] font-bold font-sans ${isLong ? 'bg-amber-500/10 text-amber-300 border border-amber-500/30' : 'bg-rose-500/10 text-rose-300 border border-rose-500/30'}">
                                ${p.side}
                            </span>
                        </td>
                        <td class="px-4 py-3 font-bold text-amber-400 text-sm">${p.price.toLocaleString()}</td>
                        <td class="px-4 py-3">${p.qty}</td>
                        <td class="px-4 py-3 text-slate-400 font-sans">${escapeHtml(p.note || '-')}</td>
                        <td class="px-4 py-3 text-right font-sans">
                            <button onclick="deletePosition('${p.id}')" title="刪除部位" class="text-slate-500 hover:text-rose-400 transition p-1">
                                <i class="fa-solid fa-trash-can"></i>
                            </button>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        /* --- Strategy Card Handling --- */
