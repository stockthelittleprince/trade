<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>交易筆記與點位追蹤系統</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        forest: {
                            bg: '#081216',
                            card: 'rgba(12, 26, 32, 0.82)',
                            border: 'rgba(26, 50, 59, 0.9)',
                            hover: 'rgba(20, 42, 50, 0.9)',
                            input: 'rgba(8, 18, 23, 0.9)'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #081216; }
        ::-webkit-scrollbar-thumb { background: #1a323b; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #264754; }
        
        /* 本地背景圖片設定（需將 background.jpg 與 index.html 同步上傳至 GitHub） */
        .treehouse-bg {
            background-color: #081216; /* 備用底色，無圖片時自動生效 */
            background-image: linear-gradient(to bottom, rgba(8, 18, 22, 0.75), rgba(8, 18, 22, 0.9)), url('background.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
        }

        .lantern-glow {
            box-shadow: 0 0 15px rgba(245, 158, 11, 0.2);
        }
        .lantern-glow:hover {
            box-shadow: 0 0 25px rgba(245, 158, 11, 0.4);
        }
    </style>
</head>
<body class="treehouse-bg text-slate-100 font-sans min-h-screen flex flex-col antialiased selection:bg-amber-500 selection:text-slate-950 pb-12">

    <!-- Top Navigation Header -->
    <header class="border-b border-forest-border bg-forest-bg/85 backdrop-blur-md sticky top-0 z-30 shadow-2xl">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="p-2 bg-amber-500/20 text-amber-300 rounded-xl border border-amber-500/30 shadow-[0_0_12px_rgba(245,158,11,0.3)]">
                    <i class="fa-solid fa-tree-city text-xl"></i>
                </div>
                <div>
                    <h1 class="font-extrabold text-lg tracking-wide text-amber-100 flex items-center gap-2">
                        TRADING JOURNAL
                        <span class="text-xs font-normal text-teal-300 bg-teal-500/20 px-2.5 py-0.5 rounded-full border border-teal-500/30">奇幻樹屋風格</span>
                    </h1>
                </div>
            </div>

            <!-- Backup and Restore Actions -->
            <div class="flex items-center space-x-2">
                <button onclick="exportData()" title="下載 JSON 備份檔" class="px-3 py-1.5 rounded-lg bg-forest-card hover:bg-forest-hover text-slate-200 border border-forest-border backdrop-blur-md transition text-xs flex items-center space-x-1.5 shadow-md">
                    <i class="fa-solid fa-download text-teal-400"></i>
                    <span>匯出備份</span>
                </button>
                <button onclick="openImportModal()" title="匯入 JSON 備份檔" class="px-3 py-1.5 rounded-lg bg-forest-card hover:bg-forest-hover text-slate-200 border border-forest-border backdrop-blur-md transition text-xs flex items-center space-x-1.5 shadow-md">
                    <i class="fa-solid fa-upload text-amber-400"></i>
                    <span>匯入資料</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-8 flex-grow w-full">

        <!-- Forms Grid Section -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">

            <!-- 1. Position Entry Form -->
            <section class="bg-forest-card border border-forest-border rounded-xl p-5 space-y-4 shadow-2xl backdrop-blur-md">
                <div class="flex items-center space-x-2 border-b border-forest-border pb-3">
                    <i class="fa-solid fa-feather-pointed text-teal-400"></i>
                    <h2 class="font-bold text-amber-100 text-sm">新增進場部位點位</h2>
                </div>

                <form onsubmit="handleAddPosition(event)" class="space-y-3 text-xs">
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-teal-200/80 mb-1">商品名稱</label>
                            <input type="text" id="posSymbol" required placeholder="例如：台指期、小台" class="w-full bg-forest-input border border-forest-border rounded-lg p-2.5 text-slate-100 focus:outline-none focus:border-teal-400">
                        </div>
                        <div>
                            <label class="block text-teal-200/80 mb-1">方向</label>
                            <select id="posSide" class="w-full bg-forest-input border border-forest-border rounded-lg p-2.5 text-slate-100 focus:outline-none focus:border-teal-400">
                                <option value="做多">做多 (Long)</option>
                                <option value="做空">做空 (Short)</option>
                            </select>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-teal-200/80 mb-1">進場點位 / 價格</label>
                            <input type="number" step="any" id="posPrice" required placeholder="例如：40000" class="w-full bg-forest-input border border-forest-border rounded-lg p-2.5 font-mono text-slate-100 focus:outline-none focus:border-teal-400">
                        </div>
                        <div>
                            <label class="block text-teal-200/80 mb-1">數量 (口/股)</label>
                            <input type="number" id="posQty" min="1" value="1" required class="w-full bg-forest-input border border-forest-border rounded-lg p-2.5 font-mono text-slate-100 focus:outline-none focus:border-teal-400">
                        </div>
                    </div>

                    <div>
                        <label class="block text-teal-200/80 mb-1">進場原因與備註 (選填)</label>
                        <input type="text" id="posNote" placeholder="例如：黑後紅策略進場第1口" class="w-full bg-forest-input border border-forest-border rounded-lg p-2.5 text-slate-100 focus:outline-none focus:border-teal-400">
                    </div>

                    <button type="submit" class="w-full bg-teal-600 hover:bg-teal-500 text-slate-950 font-bold py-2.5 rounded-lg transition shadow-lg shadow-teal-600/30 text-xs flex items-center justify-center space-x-1">
                        <i class="fa-solid fa-plus"></i>
                        <span>新增部位紀錄</span>
                    </button>
                </form>
            </section>

            <!-- 2. Create Strategy Form -->
            <section class="bg-forest-card border border-forest-border rounded-xl p-5 space-y-4 shadow-2xl backdrop-blur-md flex flex-col justify-between">
                <div>
                    <div class="flex items-center space-x-2 border-b border-forest-border pb-3 mb-3">
                        <i class="fa-solid fa-map-location-dot text-amber-400"></i>
                        <h2 class="font-bold text-amber-100 text-sm">新增特殊策略卡片</h2>
                    </div>

                    <form id="addStratForm" onsubmit="handleAddStrategy(event)" class="space-y-3 text-xs">
                        <div>
                            <label class="block text-amber-200/80 mb-1">策略名稱</label>
                            <input type="text" id="stratName" required placeholder="例如：特殊策略 黑後紅" class="w-full bg-forest-input border border-forest-border rounded-lg p-2.5 text-slate-100 focus:outline-none focus:border-amber-400">
                        </div>

                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="block text-amber-200/80 mb-1">初始累計損益 (選填)</label>
                                <input type="number" id="stratInitPnl" value="0" class="w-full bg-forest-input border border-forest-border rounded-lg p-2.5 font-mono text-slate-100 focus:outline-none focus:border-amber-400">
                            </div>
                            <div>
                                <label class="block text-amber-200/80 mb-1">初始累計次數 (選填)</label>
                                <input type="number" id="stratInitCount" value="0" class="w-full bg-forest-input border border-forest-border rounded-lg p-2.5 font-mono text-slate-100 focus:outline-none focus:border-amber-400">
                            </div>
                        </div>

                        <button type="submit" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold py-2.5 rounded-lg transition shadow-lg shadow-amber-500/30 text-xs flex items-center justify-center space-x-1 mt-2 lantern-glow">
                            <i class="fa-solid fa-scroll"></i>
                            <span>建立策略卡片</span>
                        </button>
                    </form>
                </div>
            </section>

        </div>

        <!-- Strategy Cards Section -->
        <section class="space-y-4">
            <div class="flex items-center justify-between">
                <div class="flex items-center space-x-2">
                    <div class="w-2 h-5 bg-amber-400 rounded-full shadow-[0_0_10px_rgba(245,158,11,0.6)]"></div>
                    <h2 class="text-base font-bold text-amber-100 drop-shadow-md">特殊策略與卡片統計</h2>
                </div>
            </div>

            <!-- Strategy Grid -->
            <div id="strategyGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                <!-- Dynamically rendered strategy cards -->
            </div>
        </section>

        <!-- Position Table Section -->
        <section class="bg-forest-card border border-forest-border rounded-xl p-5 space-y-4 shadow-2xl backdrop-blur-md">
            <div class="flex justify-between items-center border-b border-forest-border pb-3">
                <div class="flex items-center space-x-2">
                    <div class="w-2 h-5 bg-teal-400 rounded-full shadow-[0_0_10px_rgba(20,184,166,0.6)]"></div>
                    <h2 class="text-base font-bold text-amber-100">已記錄之進場部位點位</h2>
                    <span id="posCountBadge" class="bg-teal-500/20 text-teal-300 text-xs px-2 py-0.5 rounded-full font-mono border border-teal-500/30">0</span>
                </div>
                <button onclick="clearAllPositions()" class="text-xs bg-rose-500/20 hover:bg-rose-500/30 text-rose-300 border border-rose-500/40 px-3 py-1.5 rounded-lg transition flex items-center space-x-1 shadow-sm">
                    <i class="fa-solid fa-trash-can"></i>
                    <span>一鍵清空部位</span>
                </button>
            </div>

            <div class="overflow-x-auto">
                <table class="w-full text-left text-xs text-slate-200">
                    <thead class="bg-forest-input text-teal-200/80 font-medium uppercase border-b border-forest-border">
                        <tr>
                            <th class="px-4 py-3">時間</th>
                            <th class="px-4 py-3">商品名稱</th>
                            <th class="px-4 py-3">方向</th>
                            <th class="px-4 py-3">進場點位</th>
                            <th class="px-4 py-3">數量</th>
                            <th class="px-4 py-3">備註</th>
                            <th class="px-4 py-3 text-right">操作</th>
                        </tr>
                    </thead>
                    <tbody id="positionTableBody" class="divide-y divide-forest-border font-mono">
                        <!-- Dynamically rendered position rows -->
                    </tbody>
                </table>
            </div>
        </section>

    </main>

    <!-- Edit Strategy Modal -->
    <div id="editModalOverlay" class="fixed inset-0 bg-black/85 backdrop-blur-md z-50 hidden flex items-center justify-center p-4">
        <div class="bg-forest-card border border-forest-border rounded-xl max-w-sm w-full p-6 space-y-4 shadow-2xl backdrop-blur-lg">
            <div class="flex justify-between items-center border-b border-forest-border pb-3">
                <h3 class="font-bold text-amber-100 flex items-center space-x-2 text-sm">
                    <i class="fa-solid fa-pen-to-square text-amber-400"></i>
                    <span>直接修改策略卡片數據</span>
                </h3>
                <button onclick="closeEditModal()" class="text-slate-400 hover:text-slate-200"><i class="fa-solid fa-xmark text-base"></i></button>
            </div>

            <div class="space-y-3 text-xs">
                <input type="hidden" id="editStratId">
                <div>
                    <label class="block text-teal-200/80 mb-1">最新總累計損益</label>
                    <input type="number" id="editStratPnl" class="w-full bg-forest-input border border-forest-border rounded-lg p-2.5 font-mono text-slate-100 focus:outline-none focus:border-amber-400">
                </div>
                <div>
                    <label class="block text-teal-200/80 mb-1">最新總累計次數</label>
                    <input type="number" id="editStratCount" class="w-full bg-forest-input border border-forest-border rounded-lg p-2.5 font-mono text-slate-100 focus:outline-none focus:border-amber-400">
                </div>
            </div>

            <div class="flex justify-end space-x-2 pt-2">
                <button type="button" onclick="closeEditModal()" class="px-4 py-2 rounded-lg bg-forest-hover text-slate-300 text-xs">取消</button>
                <button type="button" onclick="saveDirectEdit()" class="px-4 py-2 rounded-lg bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold text-xs lantern-glow">儲存修改</button>
            </div>
        </div>
    </div>

    <!-- Import JSON Modal -->
    <div id="modalOverlay" class="fixed inset-0 bg-black/85 backdrop-blur-md z-50 hidden flex items-center justify-center p-4">
        <div class="bg-forest-card border border-forest-border rounded-xl max-w-md w-full p-6 space-y-4 shadow-2xl backdrop-blur-lg">
            <div class="flex justify-between items-center border-b border-forest-border pb-3">
                <h3 class="font-bold text-amber-100 flex items-center space-x-2 text-sm">
                    <i class="fa-solid fa-upload text-teal-400"></i>
                    <span>匯入 JSON 備份資料</span>
                </h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-slate-200"><i class="fa-solid fa-xmark text-base"></i></button>
            </div>

            <div class="space-y-3 text-xs">
                <input type="file" id="jsonFileInput" accept=".json" onchange="handleFileSelect(event)" class="block w-full text-xs text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-forest-hover file:text-slate-200 hover:file:bg-slate-700">
                <textarea id="importJsonText" rows="6" placeholder="或在此處直接貼上 JSON 備份內容..." class="w-full bg-forest-input border border-forest-border rounded-lg p-2.5 text-xs font-mono text-slate-200 focus:outline-none focus:border-teal-400"></textarea>
            </div>

            <div class="flex justify-end space-x-2 pt-2">
                <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-lg bg-forest-hover text-slate-300 text-xs">取消</button>
                <button type="button" onclick="executeImport()" class="px-4 py-2 rounded-lg bg-teal-600 hover:bg-teal-500 text-slate-950 font-bold text-xs">確認匯入</button>
            </div>
        </div>
    </div>

    <!-- JavaScript Application Logic -->
    <script>
        let appState = {
            positions: [],
            strategies: []
        };

        window.onload = function() {
            loadFromLocalStorage();
            if (appState.strategies.length === 0 && appState.positions.length === 0) {
                appState.strategies = [
                    { 
                        id: 's_1', 
                        name: '特殊策略 黑後紅', 
                        pnl: -3000, 
                        count: 1,
                        history: [
                            { date: getFormattedDate(), change: '-3,000', note: '初始建立' }
                        ]
                    }
                ];
                appState.positions = [
                    { id: 'p_1', date: getFormattedDate(), symbol: '小台', side: '做多', price: 40000, qty: 1, note: '黑後紅策略進場第1口' },
                    { id: 'p_2', date: getFormattedDate(), symbol: '小台', side: '做多', price: 42000, qty: 1, note: '加碼第2口' }
                ];
                saveToLocalStorage();
            }
            renderAll();
        };

        function loadFromLocalStorage() {
            const saved = localStorage.getItem('tj_app_data_v3');
            if (saved) {
                try {
                    appState = JSON.parse(saved);
                } catch(e) {
                    console.error('Data load error', e);
                }
            }
        }

        function saveToLocalStorage() {
            localStorage.setItem('tj_app_data_v3', JSON.stringify(appState));
        }

        function renderAll() {
            renderPositions();
            renderStrategies();
        }

        /* --- Position Handling --- */
        function handleAddPosition(e) {
            e.preventDefault();
            const symbol = document.getElementById('posSymbol').value.trim();
            const side = document.getElementById('posSide').value;
            const price = parseFloat(document.getElementById('posPrice').value);
            const qty = parseInt(document.getElementById('posQty').value);
            const note = document.getElementById('posNote').value.trim();

            appState.positions.unshift({
                id: 'p_' + Date.now(),
                date: getFormattedDate(),
                symbol,
                side,
                price,
                qty,
                note
            });

            saveToLocalStorage();
            renderPositions();

            document.getElementById('posSymbol').value = '';
            document.getElementById('posPrice').value = '';
            document.getElementById('posNote').value = '';
        }

        function deletePosition(id) {
            if (confirm('確定要刪除這筆部位記錄嗎？')) {
                appState.positions = appState.positions.filter(p => p.id !== id);
                saveToLocalStorage();
                renderPositions();
            }
        }

        function clearAllPositions() {
            if (appState.positions.length === 0) return;
            if (confirm('確定要刪除所有已記錄的部位點位嗎？此動作無法復原！')) {
                appState.positions = [];
                saveToLocalStorage();
                renderPositions();
            }
        }

        function renderPositions() {
            const tbody = document.getElementById('positionTableBody');
            document.getElementById('posCountBadge').innerText = appState.positions.length;

            if (appState.positions.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="7" class="text-center py-8 text-slate-400 font-sans">
                            <i class="fa-solid fa-box-open text-2xl mb-1 opacity-40 block"></i>
                            目前沒有任何進場部位紀錄
                        </td>
                    </tr>
                `;
                return;
            }

            tbody.innerHTML = appState.positions.map(p => {
                const isLong = p.side === '做多';
                return `
                    <tr class="hover:bg-forest-hover/70 transition">
                        <td class="px-4 py-3 text-slate-300">${p.date}</td>
                        <td class="px-4 py-3 font-bold text-slate-100 font-sans">${escapeHtml(p.symbol)}</td>
                        <td class="px-4 py-3">
                            <span class="px-2 py-0.5 rounded text-[10px] font-bold font-sans ${isLong ? 'bg-amber-500/20 text-amber-300 border border-amber-500/40' : 'bg-rose-500/20 text-rose-300 border border-rose-500/40'}">
                                ${p.side}
                            </span>
                        </td>
                        <td class="px-4 py-3 font-bold text-amber-400 text-sm">${p.price.toLocaleString()}</td>
                        <td class="px-4 py-3">${p.qty}</td>
                        <td class="px-4 py-3 text-slate-300 font-sans">${escapeHtml(p.note || '-')}</td>
                        <td class="px-4 py-3 text-right font-sans">
                            <button onclick="deletePosition('${p.id}')" title="刪除部位" class="text-slate-400 hover:text-rose-400 transition p-1">
                                <i class="fa-solid fa-trash-can"></i>
                            </button>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        /* --- Strategy Card Handling --- */
        function handleAddStrategy(e) {
            e.preventDefault();
            const name = document.getElementById('stratName').value.trim();
            const pnl = parseFloat(document.getElementById('stratInitPnl').value) || 0;
            const count = parseInt(document.getElementById('stratInitCount').value) || 0;

            const newStrat = {
                id: 's_' + Date.now(),
                name,
                pnl,
                count,
                history: []
            };

            if (pnl !== 0 || count !== 0) {
                newStrat.history.push({
                    date: getFormattedDate(),
                    change: (pnl >= 0 ? '+' : '') + pnl.toLocaleString(),
                    note: `建立卡片 (次數: ${count})`
                });
            }

            appState.strategies.push(newStrat);

            saveToLocalStorage();
            renderStrategies();
            document.getElementById('addStratForm').reset();
        }

        function addStrategyHistory(strat, changeText, noteText) {
            if (!strat.history) strat.history = [];
            strat.history.unshift({
                date: getFormattedDate(),
                change: changeText,
                note: noteText
            });
            if (strat.history.length > 3) {
                strat.history = strat.history.slice(0, 3);
            }
        }

        function updateStrategyValue(id) {
            const pnlInput = document.getElementById(`pnl_${id}`);
            const countInput = document.getElementById(`cnt_${id}`);
            
            const pnlStr = pnlInput.value.trim();
            const countStr = countInput.value.trim();

            const strat = appState.strategies.find(s => s.id === id);
            if (!strat) return;

            let updated = false;

            // 僅更新損益，不會自動增加次數
            if (pnlStr !== '') {
                const num = parseFloat(pnlStr);
                if (!isNaN(num)) {
                    strat.pnl += num;
                    updated = true;
                    addStrategyHistory(strat, (num >= 0 ? '+' : '') + num.toLocaleString(), `累計損益: ${strat.pnl.toLocaleString()}`);
                }
            }

            // 只有手動填寫「修改累計次數」時才變動次數
            if (countStr !== '') {
                const newCount = parseInt(countStr);
                if (!isNaN(newCount)) {
                    strat.count = newCount;
                    updated = true;
                    if (pnlStr === '') {
                        addStrategyHistory(strat, `次數改為 ${newCount}`, `總損益: ${strat.pnl.toLocaleString()}`);
                    }
                }
            }

            if (updated) {
                pnlInput.value = '';
                countInput.value = '';
                saveToLocalStorage();
                renderStrategies();
            }
        }

        function openEditModal(id) {
            const strat = appState.strategies.find(s => s.id === id);
            if (!strat) return;

            document.getElementById('editStratId').value = strat.id;
            document.getElementById('editStratPnl').value = strat.pnl;
            document.getElementById('editStratCount').value = strat.count;
            document.getElementById('editModalOverlay').classList.remove('hidden');
        }

        function closeEditModal() {
            document.getElementById('editModalOverlay').classList.add('hidden');
        }

        function saveDirectEdit() {
            const id = document.getElementById('editStratId').value;
            const pnl = parseFloat(document.getElementById('editStratPnl').value);
            const count = parseInt(document.getElementById('editStratCount').value);

            const strat = appState.strategies.find(s => s.id === id);
            if (strat) {
                if (!isNaN(pnl)) strat.pnl = pnl;
                if (!isNaN(count)) strat.count = count;
                
                addStrategyHistory(strat, `手動校正`, `損益: ${strat.pnl.toLocaleString()} (${strat.count}次)`);

                saveToLocalStorage();
                renderStrategies();
                closeEditModal();
            }
        }

        function toggleHistory(id) {
            const el = document.getElementById(`hist_${id}`);
            if (el) {
                el.classList.toggle('hidden');
            }
        }

        function deleteStrategy(id) {
            if (confirm('確定要刪除這張策略卡片嗎？')) {
                appState.strategies = appState.strategies.filter(s => s.id !== id);
                saveToLocalStorage();
                renderStrategies();
            }
        }

        function renderStrategies() {
            const grid = document.getElementById('strategyGrid');

            if (appState.strategies.length === 0) {
                grid.innerHTML = `
                    <div class="col-span-full bg-forest-card border border-forest-border rounded-xl p-8 text-center text-slate-400 text-xs backdrop-blur-md">
                        尚無策略卡片，請於上方建立新卡片。
                    </div>
                `;
                return;
            }

            grid.innerHTML = appState.strategies.map(s => {
                const isPositive = s.pnl > 0;
                const isNegative = s.pnl < 0;
                const pnlColorClass = isPositive ? 'text-amber-400' : (isNegative ? 'text-rose-400' : 'text-slate-300');
                const pnlPrefix = isPositive ? '+' : '';

                const historyList = s.history || [];
                const historyHtml = historyList.length > 0 
                    ? historyList.map(h => `
                        <div class="flex justify-between items-center text-[10px] border-b border-forest-border/60 py-1 last:border-0">
                            <span class="text-slate-400">${h.date}</span>
                            <span class="font-mono font-bold text-amber-300">${h.change}</span>
                            <span class="text-slate-300 truncate max-w-[110px]">${h.note}</span>
                        </div>
                      `).join('')
                    : `<div class="text-[10px] text-slate-400 text-center py-1">尚無異動紀錄</div>`;

                return `
                    <div class="bg-forest-card border border-forest-border rounded-xl p-4 space-y-4 shadow-2xl backdrop-blur-md flex flex-col justify-between hover:border-amber-500/50 transition">
                        <div>
                            <!-- Header -->
                            <div class="flex justify-between items-center border-b border-forest-border pb-2.5">
                                <h3 class="font-bold text-amber-300 text-sm flex items-center space-x-2">
                                    <i class="fa-solid fa-lantern text-amber-400 text-xs"></i>
                                    <span>${escapeHtml(s.name)}</span>
                                </h3>
                                <div class="flex items-center space-x-2">
                                    <button onclick="openEditModal('${s.id}')" title="編輯數值" class="text-slate-400 hover:text-amber-400 transition p-1">
                                        <i class="fa-solid fa-pen-to-square text-sm"></i>
                                    </button>
                                    <button onclick="deleteStrategy('${s.id}')" title="刪除卡片" class="text-slate-400 hover:text-rose-400 transition p-1">
                                        <i class="fa-solid fa-trash-can text-sm"></i>
                                    </button>
                                </div>
                            </div>

                            <!-- Stat Box -->
                            <div class="grid grid-cols-2 gap-2 bg-forest-input border border-forest-border rounded-lg p-3 my-3 text-center">
                                <div>
                                    <div class="text-[10px] text-teal-200/70">累計損益</div>
                                    <div class="text-base font-bold font-mono ${pnlColorClass} mt-0.5">
                                        ${pnlPrefix}${s.pnl.toLocaleString()}
                                    </div>
                                </div>
                                <div>
                                    <div class="text-[10px] text-teal-200/70">累計次數</div>
                                    <div class="text-base font-bold font-mono text-slate-100 mt-0.5">
                                        ${s.count} 次
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Inputs & Collapsible History -->
                        <div class="space-y-2 text-xs">
                            <div class="grid grid-cols-2 gap-2">
                                <input 
                                    type="text" 
                                    id="pnl_${s.id}" 
                                    placeholder="+3000 / -2000" 
                                    onkeydown="if(event.key==='Enter') updateStrategyValue('${s.id}')"
                                    class="bg-forest-input border border-forest-border rounded-lg px-2.5 py-1.5 font-mono text-slate-100 focus:outline-none focus:border-amber-400"
                                >
                                <input 
                                    type="number" 
                                    id="cnt_${s.id}" 
                                    placeholder="修改累計次數" 
                                    onkeydown="if(event.key==='Enter') updateStrategyValue('${s.id}')"
                                    class="bg-forest-input border border-forest-border rounded-lg px-2.5 py-1.5 font-mono text-slate-100 focus:outline-none focus:border-amber-400"
                                >
                            </div>
                            <button onclick="updateStrategyValue('${s.id}')" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold py-1.5 rounded-lg transition text-xs lantern-glow">
                                更新數據
                            </button>

                            <!-- History Toggle Button -->
                            <div class="pt-1">
                                <button onclick="toggleHistory('${s.id}')" class="w-full text-[10px] text-teal-200/70 hover:text-amber-300 flex items-center justify-between py-1 px-1 transition">
                                    <span>📜 近 3 次變動紀錄</span>
                                    <i class="fa-solid fa-chevron-down text-[10px]"></i>
                                </button>
                                <div id="hist_${s.id}" class="hidden bg-forest-input/90 border border-forest-border rounded-lg p-2 mt-1 space-y-1">
                                    ${historyHtml}
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        /* --- Backup and File Import/Export --- */
        function exportData() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(appState, null, 2));
            const anchor = document.createElement('a');
            anchor.setAttribute("href", dataStr);
            anchor.setAttribute("download", `Trading_Journal_${new Date().toISOString().slice(0, 10)}.json`);
            document.body.appendChild(anchor);
            anchor.click();
            anchor.remove();
        }

        function openImportModal() {
            document.getElementById('importJsonText').value = '';
            document.getElementById('modalOverlay').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('modalOverlay').classList.add('hidden');
        }

        function handleFileSelect(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(evt) {
                document.getElementById('importJsonText').value = evt.target.result;
            };
            reader.readAsText(file);
        }

        function executeImport() {
            const text = document.getElementById('importJsonText').value;
            try {
                const parsed = JSON.parse(text);
                if (parsed) {
                    appState = {
                        positions: parsed.positions || [],
                        strategies: parsed.strategies || []
                    };
                    saveToLocalStorage();
                    renderAll();
                    closeModal();
                    alert('資料成功匯入！');
                }
            } catch (err) {
                alert('JSON 解析失敗，請確定格式正確。');
            }
        }

        function getFormattedDate() {
            const now = new Date();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            return `${month}/${day} ${hours}:${minutes}`;
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>"']/g, function(m) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
            });
        }
    </script>
</body>
</html>
